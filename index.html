<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script defer src="/_vercel/insights/script.js"></script>
  <title>Mirror Mentor</title>
</head>
<body>
  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="authModalTitle">Sign In</h2>
      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Email" required>
        <input type="password" id="authPassword" placeholder="Password" required>
        <div id="authError" class="error-message"></div>
        <button type="submit" id="authSubmit">Sign In</button>
      </form>
      <p id="authToggle">
        Don't have an account? <a href="#" id="toggleAuth">Sign Up</a>
      </p>
    </div>
  </div>

  <!-- Conversation Sidebar -->
  <aside class="conversation-sidebar" id="conversationSidebar" style="display:none;">
    <div class="sidebar-header">
      <h3>Conversations</h3>
      <button id="newConversationBtn" class="btn-primary">+ New</button>
    </div>
    <div id="conversationList" class="conversation-list">
      <!-- Conversations will be loaded here -->
    </div>
  </aside>

  <section class="main-container">
    <!-- Header with Auth Status -->
    <section class="header-section">
      <img src="images/logosss.png" class="header-icon" alt="Code icon">
      <div class="header-container">
        <span class="header-text">Mirror Mentor</span>
        <span class="header-subtext">Guided Learning through thoughtful process</span>
      </div>
      <div class="auth-section">
        <span id="userEmail" class="user-email"></span>
        <button id="signInBtn" class="auth-btn">Sign In</button>
        <button id="signOutBtn" class="auth-btn" style="display:none;">Sign Out</button>
      </div>
    </section>

    <hr>

    <!-- Main Body: Code Input | Chat -->
    <section class="body-section">
      <!-- Left: Code Input -->
      <section class="left-side-section">
        <div class="left-side-container">
          <div class="left-text-container">
            <span class="subheader-text">Paste Your Code</span>
            <span class="subheader-text2">Paste your code snippet below</span>
          </div>
          <textarea class="code-input" placeholder="Paste your code here..."></textarea>
          <button class="clear-btn" title="Clear code">Clear</button>
        </div>
      </section>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Right: AI Chat -->
      <section class="right-side-section">
        <div class="right-side-container">
          <div class="right-text-container">
            <span class="subheader-text">AI Professor</span>
            <span class="subheader-text2">Ask questions and get guided insights</span>
          </div>
          <div class="chat-box">
            <div class="chat-messages">
              <!-- messages go here -->
            </div>
            <div class="chat-input-area">
              <input class="chat-input" placeholder="Type your message...">
              <button class="chat-send">➤</button>
            </div>
          </div>
        </div>
      </section>
    </section>
  </section>

  <script type="module" src="/main.js"></script>
</body>
</html>
