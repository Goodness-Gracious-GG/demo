<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Code TWINS</title>
</head>
<body>
  <section class="main-container">
        <section class="header-section">
            <img src="images/code-icon.png" class="header-icon" alt="Code icon">
            <span class="header-text">CODE TWINS</span>
        </section>

        <hr>

        <section class="subheader-section">
            <div class="left-side-container">
                <span class="subheader-text">Paste Your Code</span>
            </div>

            <div class="divider"></div>

            <div class="right-side-container">
                <span class="subheader-text">AI Professor</span>
            </div>
        </section>

        <hr>

        <section class="content-section">
            <div class="second-side-container">
                <textarea class="code-input" placeholder="Paste your code here..."></textarea>
            </div>
            <div class="divider"></div>
            <div class="chat-box">
                <div class="chat-messages">
                <!-- messages go here -->
                </div>
                <div class="chat-input-area">
                <input class="chat-input" placeholder="Type your message...">
                <button class="chat-send">➤</button>
                </div>
            </div>
        </section>
  </section>

  <script>
    // Connect frontend to backend
    const codeInput = document.querySelector('.code-input');
    const chatMessages = document.querySelector('.chat-messages');
    const chatInput = document.querySelector('.chat-input');
    const chatSend = document.querySelector('.chat-send');

    // Add message to chat
    function addMessage(text, isUser = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = isUser ? 'user-message' : 'ai-message';
      messageDiv.textContent = text;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Analyze code with backend
     async function analyzeCode() {
       const code = codeInput.value.trim();
       if (!code) return;

       addMessage('Analyzing your code...', false);

       try {
         // Add timeout to prevent hanging
         const controller = new AbortController();
         const timeoutId = setTimeout(() => controller.abort(), 30000);
         
         const response = await fetch('http://localhost:8000/analyze', {
           method: 'POST',
           headers: {
             'Content-Type': 'application/json',
           },
           body: JSON.stringify({
             code: code,
             language: 'python'
           }),
           signal: controller.signal
         });
         
         clearTimeout(timeoutId);

        const data = await response.json();
        
        if (!response.ok) {
          // Server returned an error
          addMessage('Error: ' + (data.detail || 'Unknown error'), false);
          return;
        }
        
        // Display the analysis
        addMessage('🧠 Understanding: ' + (data.understanding || 'No understanding provided'), false);
        
        if (data.observations && data.observations.length > 0) {
          addMessage('⚠️ Observations:', false);
          data.observations.forEach(obs => addMessage('  - ' + obs, false));
        } else {
          addMessage('⚠️ Observations: None', false);
        }
        
        if (data.questions && data.questions.length > 0) {
          addMessage('❓ Questions:', false);
          data.questions.forEach(q => addMessage('  - ' + q, false));
        } else {
          addMessage('❓ Questions: None', false);
        }
        
        if (data.suggestions && data.suggestions.length > 0) {
          addMessage('💡 Suggestions:', false);
          data.suggestions.forEach(s => addMessage('  - ' + s, false));
        } else {
          addMessage('💡 Suggestions: None', false);
        }
      } catch (error) {
         if (error.name === 'AbortError') {
           addMessage('Error: Request timed out. The server is taking too long to respond.', false);
         } else {
           addMessage('Error: ' + error.message, false);
         }
       }
    }

    // Handle send button click
    chatSend.addEventListener('click', () => {
      analyzeCode();
    });

    // Handle Enter key in code input
    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        analyzeCode();
      }
    });
  </script>
</body>
</html>
