<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Code TWINS</title>
</head>
<body>
  <section class="main-container">
        <section class="header-section">
            <img src="images/code-icon.png" class="header-icon" alt="Code icon">
            <span class="header-text">CODE TWINS</span>
        </section>

        <hr>

        <section class="subheader-section">
            <div class="left-side-container">
                <span class="subheader-text">Paste Your Code</span>
            </div>

            <div class="divider"></div>

            <div class="right-side-container">
                <span class="subheader-text">AI Professor</span>
            </div>
        </section>

        <hr>

        <section class="content-section">
            <div class="second-side-container">
                <textarea class="code-input" placeholder="Paste your code here..."></textarea>
            </div>
            <div class="divider"></div>
            <div class="chat-box">
                <div class="chat-messages">
                <!-- messages go here -->
                </div>
                <div class="chat-input-area">
                <input class="chat-input" placeholder="Type your message...">
                <button class="chat-send">➤</button>
                </div>
            </div>
        </section>
  </section>
</body>
</html>
